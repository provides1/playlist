name:  รันอัตโนมัติทุกวัน  20:00

on:
  schedule:
    - cron: "0 13 * * *"   # 20:00 ไทย -> 13:00 UTC
  #  - cron: "0 15 * * *"   # 22:00 ไทย -> 15:00 UTC
  workflow_dispatch:


jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install gdown
        run: pip install gdown

      - name: Python script
        env:
          FILE_URL: ${{ secrets.FORALL }}   
        run: |
          set +x  
          gdown "$FILE_URL" -O script.py

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || true

      - name: Run Script
        run: |
          python script.py "https://flixmono.com/serie/generation-to-generation/" || true
          python script.py "https://www.series-days.com/generation-to-generation/" || true
      
